<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuários - LibraSys</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <link
            th:href="@{/css/usuarios.css}"
            href="/css/usuarios.css"
            rel="stylesheet"
            type="text/css">

</head>

<body>

<div class="sidebar">

    <div class="logo">

        <i class="bi bi-book-half"></i>

        LibraSys

    </div>


    <div class="menu-title">
        Principal
    </div>


    <a href="/dashboard">

        <i class="bi bi-grid-1x2-fill"></i>

        Dashboard

    </a>


    <a href="/livros">

        <i class="bi bi-book"></i>

        Livros

    </a>


    <a href="/exemplares">

        <i class="bi bi-collection"></i>

        Exemplares

    </a>


    <a href="/usuarios" class="active">

        <i class="bi bi-people"></i>

        Usuários

    </a>


    <a href="/autores">

        <i class="bi bi-person-vcard"></i>

        Autores

    </a>


    <a href="/editoras">

        <i class="bi bi-building"></i>

        Editoras

    </a>


    <a href="/emprestimos">

        <i class="bi bi-arrow-left-right"></i>

        Empréstimos

    </a>


    <div class="logout">

        <form th:action="@{/logout}" method="post">

            <button
                    type="submit"
                    class="sidebar-link">

                <i class="bi bi-box-arrow-right"></i>

                Sair

            </button>

        </form>

    </div>

</div>


<div class="main">

    <div class="page-header">

        <div>

            <h2>
                Usuários
            </h2>

            <p>
                Gerencie os usuários cadastrados na biblioteca.
            </p>

        </div>

    </div>


    <div class="content-card">

        <div class="filters">

            <button
                    type="button"
                    id="btnNovoUsuario"
                    class="btn btn-primary px-4"
                    data-bs-toggle="modal"
                    data-bs-target="#modalUsuario">

                <i class="bi bi-plus-lg"></i>

                Novo usuário

            </button>

        </div>


        <div class="table-responsive">

            <table class="table">

                <thead>

                <tr>

                    <th>Usuário</th>

                    <th>CPF</th>

                    <th>E-mail</th>

                    <th>Telefone</th>

                    <th>Status</th>

                    <th class="text-end">
                        Ações
                    </th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="usuario : ${usuarios}">

                    <td>

                        <div
                                class="user-name"
                                th:text="${usuario.nome}">

                            nome

                        </div>

                    </td>


                    <td th:text="${usuario.cpf}">
                        cpf
                    </td>


                    <td th:text="${usuario.email}">
                        email
                    </td>


                    <td th:text="${usuario.telefone}">
                        telefone
                    </td>


                    <td>

                        <span
                                th:if="${usuario.ativo}"
                                class="status status-active">

                            <i class="bi bi-check-circle"></i>

                            Ativo

                        </span>


                        <span
                                th:unless="${usuario.ativo}"
                                class="status status-inactive">

                            <i class="bi bi-x-circle"></i>

                            Inativo

                        </span>

                    </td>


                    <td class="text-end">

                        <!-- EDITAR -->

                        <button
                                type="button"
                                class="action-btn action-edit"
                                th:onclick="|editarUsuario(${usuario.id})|">

                            <i class="bi bi-pencil"></i>

                        </button>


                        <!-- EXCLUIR -->

                        <button
                                type="button"
                                class="action-btn action-delete"
                                th:onclick="|excluirUsuario(${usuario.id})|">

                            <i class="bi bi-trash"></i>

                        </button>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- =========================================================
     MODAL DE USUÁRIO
========================================================= -->

<div
        class="modal fade"
        id="modalUsuario"
        tabindex="-1"
        aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="bi bi-person-plus me-2"></i>

                    <span id="tituloModalUsuario">
                        Novo usuário
                    </span>

                </h5>


                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                </button>

            </div>


            <!-- FORMULÁRIO -->

            <form id="formUsuario">

                <!-- ID DO USUÁRIO -->

                <input
                        type="hidden"
                        id="usuarioId">


                <!-- CSRF -->

                <input
                        type="hidden"
                        id="csrfToken"
                        th:value="${_csrf.token}">


                <div class="modal-body">

                    <!-- NOME -->

                    <div class="mb-3">

                        <label
                                for="nome"
                                class="form-label">

                            Nome

                        </label>


                        <input
                                type="text"
                                name="nome"
                                id="nome"
                                class="form-control"
                                required>


                        <div
                                id="erro-nome"
                                class="erro-validacao">

                        </div>

                    </div>


                    <!-- CPF / TELEFONE -->

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label
                                    for="cpf"
                                    class="form-label">

                                CPF

                            </label>


                            <input
                                    type="text"
                                    name="cpf"
                                    id="cpf"
                                    class="form-control"
                                    pattern="^(\d{3}\.\d{3}\.\d{3}-\d{2}|\d{11})$"
                                    required>


                            <div
                                    id="erro-cpf"
                                    class="erro-validacao">

                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label
                                    for="telefone"
                                    class="form-label">

                                Telefone

                            </label>


                            <input
                                    type="text"
                                    name="telefone"
                                    id="telefone"
                                    class="form-control"
                                    pattern="^\d{2}9?\d{8}$"
                                    required>


                            <div
                                    id="erro-telefone"
                                    class="erro-validacao">

                            </div>

                        </div>

                    </div>


                    <!-- E-MAIL -->

                    <div class="mb-3">

                        <label
                                for="email"
                                class="form-label">

                            E-mail

                        </label>


                        <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-control"
                                required>


                        <div
                                id="erro-email"
                                class="erro-validacao">

                        </div>

                    </div>


                    <!-- SENHA -->

                    <div class="mb-3">

                        <label
                                for="senha"
                                class="form-label">

                            Senha

                        </label>


                        <input
                                type="password"
                                name="senha"
                                id="senha"
                                class="form-control"
                                required>


                        <div
                                id="erro-senha"
                                class="erro-validacao">

                        </div>

                    </div>


                    <!-- TIPO -->

                    <div class="mb-3">

                        <label
                                for="tipo"
                                class="form-label">

                            Tipo de usuário

                        </label>


                        <select
                                name="tipo"
                                id="tipo"
                                class="form-select"
                                required>

                            <option value="">
                                Selecione o tipo
                            </option>

                            <option value="USUARIO">
                                Usuário
                            </option>

                            <option value="ADMIN">
                                Administrador
                            </option>

                        </select>


                        <div
                                id="erro-tipo"
                                class="erro-validacao">

                        </div>

                    </div>

                </div>


                <!-- RODAPÉ DO MODAL -->

                <div class="modal-footer">

                    <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Cancelar

                    </button>


                    <button
                            type="submit"
                            id="btnSalvarUsuario"
                            class="btn btn-primary">

                        <i class="bi bi-check-lg"></i>

                        <span id="textoBotaoUsuario">
                            Salvar usuário
                        </span>

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- BOOTSTRAP -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- JAVASCRIPT DA PÁGINA -->

<script
        th:src="@{/js/usuarios.js}"
        src="/js/usuarios.js">
</script>

</body>

</html>
