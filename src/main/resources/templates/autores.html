<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autores - LibraSys</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/autores.css}"
          href="/css/autores.css"
          rel="stylesheet"
          type="text/css">

</head>

<body>

<div class="sidebar">

    <div class="logo">
        <i class="bi bi-book-half"></i>
        LibraSys
    </div>

    <div class="menu-title">Principal</div>

    <a href="/dashboard">
        <i class="bi bi-grid-1x2-fill"></i>
        Dashboard
    </a>

    <a href="/livros">
        <i class="bi bi-book"></i>
        Livros
    </a>

    <a href="/exemplares">
        <i class="bi bi-collection"></i>
        Exemplares
    </a>

    <a href="/usuarios">
        <i class="bi bi-people"></i>
        Usuários
    </a>

    <a href="/autores" class="active">
        <i class="bi bi-person-vcard"></i>
        Autores
    </a>

    <a href="/editoras">
        <i class="bi bi-building"></i>
        Editoras
    </a>

    <a href="/emprestimos">
        <i class="bi bi-arrow-left-right"></i>
        Empréstimos
    </a>

    <div class="logout">

        <form th:action="@{/logout}" method="post">

            <button type="submit" class="sidebar-link">

                <i class="bi bi-box-arrow-right"></i>
                Sair

            </button>

        </form>

    </div>

</div>


<div class="main">

    <div class="page-header">

        <div>

            <h2>Autores</h2>

            <p>
                Gerencie os autores cadastrados no sistema.
            </p>

        </div>

    </div>


    <div class="content-card">

        <div class="filters">

            <button
                    class="btn btn-primary px-4"
                    data-bs-toggle="modal"
                    data-bs-target="#modalAutor">

                <i class="bi bi-plus-lg"></i>
                Novo autor

            </button>

        </div>


        <div class="table-responsive">

            <table class="table">

                <thead>

                <tr>

                    <th>Nome</th>
                    <th>Nacionalidade</th>
                    <th>Data de nascimento</th>
                    <th class="text-end">Ações</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="autor : ${autores}">

                    <td th:text="${autor.nome}">
                        Nome
                    </td>

                    <td th:text="${autor.nacionalidade}">
                        Nacionalidade
                    </td>

                    <td th:text="${autor.dataNascimento}">
                        Data
                    </td>

                    <td class="text-end">

                        <!-- EDITAR -->

                        <button
                                type="button"
                                class="action-btn action-edit"
                                th:onclick="|editarAutor(${autor.id})|">

                            <i class="bi bi-pencil"></i>

                        </button>

                        <!-- EXCLUIR -->

                        <button
                                type="button"
                                class="action-btn action-delete"
                                th:onclick="|excluirAutor(${autor.id})|">

                            <i class="bi bi-trash"></i>

                        </button>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- MODAL -->

<div class="modal fade" id="modalAutor" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="bi bi-person-vcard me-2"></i>
                    Novo autor

                </h5>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>


            <form id="formAutor">

                <input type="hidden" id="autorId">

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label">
                            Nome
                        </label>

                        <input
                                type="text"
                                id="nome"
                                name="nome"
                                class="form-control"
                                required>

                        <div id="erro-nome" class="erro-validacao"></div>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Nacionalidade
                        </label>

                        <input
                                type="text"
                                id="nacionalidade"
                                name="nacionalidade"
                                class="form-control">

                        <div id="erro-nacionalidade" class="erro-validacao"></div>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Data de nascimento
                        </label>

                        <input
                                type="date"
                                id="dataNascimento"
                                name="dataNascimento"
                                class="form-control">

                        <div id="erro-dataNascimento" class="erro-validacao"></div>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                            type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-lg"></i>
                        Salvar autor

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script th:src="@{/js/autores.js}"></script>

</body>

</html>
