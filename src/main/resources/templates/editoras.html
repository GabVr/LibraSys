<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editoras - LibraSys</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/editoras.css}"
          href="/css/editoras.css"
          rel="stylesheet"
          type="text/css">

</head>

<body>

<div class="sidebar">

    <div class="logo">
        <i class="bi bi-book-half"></i>
        LibraSys
    </div>

    <div class="menu-title">Principal</div>

    <a href="/dashboard">
        <i class="bi bi-grid-1x2-fill"></i>
        Dashboard
    </a>

    <a href="/livros">
        <i class="bi bi-book"></i>
        Livros
    </a>

    <a href="/exemplares">
        <i class="bi bi-collection"></i>
        Exemplares
    </a>

    <a href="/usuarios">
        <i class="bi bi-people"></i>
        Usuários
    </a>

    <a href="/autores">
        <i class="bi bi-person-vcard"></i>
        Autores
    </a>

    <a href="/editoras" class="active">
        <i class="bi bi-building"></i>
        Editoras
    </a>

    <a href="/emprestimos">
        <i class="bi bi-arrow-left-right"></i>
        Empréstimos
    </a>

    <div class="logout">

        <form th:action="@{/logout}" method="post">

            <button type="submit" class="sidebar-link">

                <i class="bi bi-box-arrow-right"></i>
                Sair

            </button>

        </form>

    </div>

</div>


<div class="main">

    <div class="page-header">

        <h2>Editoras</h2>

        <p>
            Gerencie as editoras dos livros cadastrados.
        </p>

    </div>


    <div class="content-card">

        <div class="filters">

            <button
                    class="btn btn-primary px-4"
                    data-bs-toggle="modal"
                    data-bs-target="#modalEditora">

                <i class="bi bi-plus-lg"></i>
                Nova editora

            </button>

        </div>


        <div class="table-responsive">

            <table class="table">

                <thead>

                <tr>

                    <th>Nome</th>
                    <th>Cidade</th>
                    <th>E-mail</th>
                    <th class="text-end">Ações</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="editora : ${editoras}">

                    <td>

                        <span
                                class="publisher-name"
                                th:text="${editora.nome}">

                            Companhia das Letras

                        </span>

                    </td>

                    <td th:text="${editora.cidade}">
                        São Paulo
                    </td>

                    <td th:text="${editora.email}">
                        contato@editora.com
                    </td>

                    <td class="text-end">

                        <!-- EDITAR -->

                        <button
                                type="button"
                                class="action-btn action-edit"
                                th:onclick="|editarEditora(${editora.id})|">

                            <i class="bi bi-pencil"></i>

                        </button>

                        <!-- EXCLUIR -->

                        <button
                                type="button"
                                class="action-btn action-delete"
                                th:onclick="|excluirEditora(${editora.id})|">

                            <i class="bi bi-trash"></i>

                        </button>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- MODAL -->

<div class="modal fade" id="modalEditora" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="bi bi-building me-2"></i>
                    Nova editora

                </h5>

            </div>


            <form id="formEditora">

                <input type="hidden" id="editoraId">

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label">
                            Nome
                        </label>

                        <input
                                type="text"
                                id="nome"
                                name="nome"
                                class="form-control"
                                required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Cidade
                        </label>

                        <input
                                type="text"
                                id="cidade"
                                name="cidade"
                                class="form-control">

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            E-mail
                        </label>

                        <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control">

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                            type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-lg"></i>
                        Salvar editora

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script th:src="@{/js/editoras.js}"></script>

</body>

</html>
